services:
  mysql:
    image: mysql:8.0
    container_name: study-helper-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: study_helper
      MYSQL_USER: study
      MYSQL_PASSWORD: study123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
